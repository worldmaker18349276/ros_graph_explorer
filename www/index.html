<!DOCTYPE html>
<html>
<head>
    <title>ESM ROS Graph</title>
</head>
<body style="background: #2c2c2c;">
    <div id="cy" style="width: 100%; height: 600px; background: #2c2c2c; border: 1px solid #484848;"></div>
    <div id="panel-container" style="position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%;"></div>

    <div id="graph-filter" style="
        position: absolute; bottom: 20px; left: 20px; z-index: 1001; 
        background: #252525; padding: 10px; border-radius: 4px; 
        border: 1px solid #444; color: #c4c4c4; font-family: monospace;">
    
        <span style="margin-right: 8px;">Exclude:</span>
        <input type="text" id="filter-input" placeholder="" style="
            background: #1a1a1a; color: #efefef; border: 1px solid #444; 
            padding: 4px 8px; border-radius: 3px; outline: none; width: 180px;">
    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
